# Board status -> dashboard status (introduced in 0.5.0).
#
# The GitHub Project V2 board status is the LEADING status for the
# dashboard's stats pills, card border color and status filter. Keys are
# matched case-insensitively (and trimmed) against the board's status
# field value. Unknown or missing board values fall back to the
# component-table rollup, so a renamed board column degrades gracefully
# instead of breaking the build.
#
# Allowed bucket values: open, wip, review, published, done, na.
map:
  "Awaiting Triage": open
  "Looking for Translator": open
  "Translation in Progress": wip
  "Preparing to Publish": wip
  "Ready for Review": review
  "Published or Closed": published
